<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a{
            width: 120px;
            height: 50px;
            background-color: yellow;
            transform: rotate(20deg);
        }
        .b{
            width: 120px;
            height: 50px;
            background-color: yellow;
            transform: skewY(20deg)}
        .c{
            width: 120px;
            height: 50px;
            background-color: yellow;
            transform: scale(1,5);
        }
        
        .d{
            width: 120px;
            height: 50px;
            background-color: yellow;
            transform: translateX(100%); }
       
    </style>
</head>
<body>
    <h2>Transform: rotate(20deg)</h2>
    <div class="a">rotate - xoay</div>
    <h2>Transform: skewY(20deg)</h2>
    <div class="b">skewY - nghiêng</div>
    <h2>Transform: scale(1.5)</h2>
    <div class="c">scale - phóng to</div>
    <h2>Transform: trangslateX(100%)</h2>
    <div class="d">trangslateX - di chuyển</div>
</body>
</html>
